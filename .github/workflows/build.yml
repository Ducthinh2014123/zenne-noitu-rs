name: Build Zenne Bot (Linux x86_64 & ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libopus-dev libssl-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Upload zenne-bot artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenne-bot-linux-x86_64
          path: target/release/zenne-bot
