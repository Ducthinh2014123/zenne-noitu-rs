[workspace]
resolver = "2"
members = [
    "crates/zenne-core",
    "crates/zenne-games",
    "crates/zenne-music",
    "crates/zenne-api",
    "crates/zenne-discord",
    "crates/zenne-telegram",
    "crates/zenne-twitch",
    "crates/zenne-revolt",
]

[package]
name = "zenne-bot"
version = "2.0.0"
edition = "2021"
description = "Zenne Noitu & Minigames All-in-One Bot (Discord, Telegram, Twitch, Revolt) in Rust"

[[bin]]
name = "zenne-bot"
path = "src/main.rs"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
dashmap = "6.1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1.11"
url = "2.5"
once_cell = "1.20"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libsql = { version = "0.6", default-features = false, features = ["remote", "tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "voice"] }
poise = "0.6"
songbird = { version = "0.6", features = ["builtin-queue"] }
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }
bcrypt = "0.16"
uuid = { version = "1.11", features = ["v4"] }

[dependencies]
zenne-core = { path = "crates/zenne-core" }
zenne-games = { path = "crates/zenne-games" }
zenne-music = { path = "crates/zenne-music" }
zenne-api = { path = "crates/zenne-api" }
zenne-discord = { path = "crates/zenne-discord" }
zenne-telegram = { path = "crates/zenne-telegram" }
zenne-twitch = { path = "crates/zenne-twitch" }
zenne-revolt = { path = "crates/zenne-revolt" }
tokio.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true
